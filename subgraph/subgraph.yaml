specVersion: 1.0.0
description: >-
  Aval — aval-worldchain Subgraph. Indexes AvalRegistry, ReportRegistry,
  PlatformRegistry, and PresenceDrip on World Chain. The contract stores
  facts; this Subgraph stores the edges; @aval/engine computes score, tier,
  and depth live, off-chain, from what's indexed here (docs/02-contracts.md
  §1). Addresses below are the LIVE World Chain mainnet (chainId 480)
  deployment — each verified with eth_getCode against
  https://worldchain-mainnet.g.alchemy.com/public, and each startBlock pinned
  to the contract's creation receipt in
  contracts/broadcast/Deploy.s.sol/480/run-latest.json. NOTE: they do NOT match
  deployments/worldchain-mainnet.json, which still records an earlier, abandoned
  deploy of the same script (AvalRegistry 0x7a294C7C…, 1 Enrolled log, then
  superseded); the live set below is the one app/.env.local reads and the one
  carrying the real Enrolled/Vouched logs.
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: AvalRegistry
    network: worldchain
    source:
      address: "0x6fEfEf2d44203300a6a33d631840C972181b8722" # AvalRegistry on World Chain mainnet; eth_getCode -> 7645 bytes
      abi: AvalRegistry
      startBlock: 32833177 # creation block, from the deploy receipt (not a guess, not 0)
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Account
        - Vouch
        - FraudEvent
        - Protocol
        - ProtocolDailySnapshot
      abis:
        - name: AvalRegistry
          file: ./abis/AvalRegistry.json
      eventHandlers:
        - event: Enrolled(indexed address,indexed uint256,bytes32,uint64,string)
          handler: handleEnrolled
        - event: Vouched(indexed address,indexed address,uint64,uint64)
          handler: handleVouched
        - event: Reaffirmed(indexed address,indexed address,uint64)
          handler: handleReaffirmed
        - event: Revoked(indexed address,indexed address,uint64)
          handler: handleRevoked
        - event: CredentialRenewed(indexed address,uint64)
          handler: handleCredentialRenewed
        - event: FraudConfirmed(indexed address,uint64,bytes32)
          handler: handleFraudConfirmed
        - event: SlotPenaltyApplied(indexed address,uint64)
          handler: handleSlotPenaltyApplied
        - event: AttestorSet(indexed address,bool)
          handler: handleAttestorSet
      file: ./src/aval-registry.ts

  - kind: ethereum
    name: ReportRegistry
    network: worldchain
    source:
      address: "0x4570B517C75A90F85c9FeD321113fB80FC777bcC" # ReportRegistry on World Chain mainnet; eth_getCode -> 9938 bytes
      abi: ReportRegistry
      startBlock: 32833182 # creation block, from the deploy receipt (not a guess, not 0)
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Report
        - Rebuttal
      abis:
        - name: ReportRegistry
          file: ./abis/ReportRegistry.json
      eventHandlers:
        - event: ReportFiled(indexed bytes32,indexed address,indexed address,uint32,uint128,bytes32)
          handler: handleReportFiled
        - event: Rebutted(indexed bytes32,indexed address,uint128)
          handler: handleRebutted
        - event: Escalated(indexed bytes32,address[5])
          handler: handleEscalated
        - event: Resolved(indexed bytes32,uint8,uint64)
          handler: handleResolved
        - event: ReportDecayed(indexed bytes32,uint32)
          handler: handleReportDecayed
      file: ./src/report-registry.ts

  - kind: ethereum
    name: PlatformRegistry
    network: worldchain
    source:
      address: "0xbBEE544679F9C5a8784F30195a9030131f9E9106" # PlatformRegistry on World Chain mainnet; eth_getCode -> 7692 bytes
      abi: PlatformRegistry
      startBlock: 32833180 # creation block, from the deploy receipt (not a guess, not 0)
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Platform
        - PlatformVouch
        - ScoreRequest
      abis:
        - name: PlatformRegistry
          file: ./abis/PlatformRegistry.json
      eventHandlers:
        - event: PlatformRegistered(indexed address,string,uint128)
          handler: handlePlatformRegistered
        - event: PlatformVouched(indexed address,indexed address,uint64)
          handler: handlePlatformVouched
        - event: PlatformVouchRevoked(indexed address,indexed address)
          handler: handlePlatformVouchRevoked
        - event: ScoreRequested(indexed bytes32,indexed address,indexed address,bytes32,uint64)
          handler: handleScoreRequested
        - event: PlatformBondSlashed(indexed address,uint128,bytes32)
          handler: handlePlatformBondSlashed
      file: ./src/platform-registry.ts

  - kind: ethereum
    name: PresenceDrip
    network: worldchain
    source:
      address: "0x4C0cf0D239A1012D432EDEa47e3BB1cb00F5192d" # PresenceDrip on World Chain mainnet; eth_getCode -> 5444 bytes
      abi: PresenceDrip
      startBlock: 32833183 # creation block, from the deploy receipt (not a guess, not 0)
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - PresenceClaim
      abis:
        - name: PresenceDrip
          file: ./abis/PresenceDrip.json
      eventHandlers:
        - event: Claimed(indexed address,uint256,uint64,uint64)
          handler: handleClaimed
        - event: TenureZeroed(indexed address,bytes32)
          handler: handleTenureZeroed
        - event: DripRateChanged(uint256,uint32)
          handler: handleDripRateChanged
      file: ./src/presence-drip.ts
