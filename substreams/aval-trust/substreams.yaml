specVersion: v0.1.0

package:
  name: aval_trust_graph
  version: v0.2.0
  url: https://github.com/aval-protocol/aval
  description: |
    Composable trust-graph extractor. Emits standardized TrustEvent (VOUCH /
    REVOKE / REAFFIRM / REPORT / REPORT_RESOLVED) for ANY contract that
    follows the trust-graph v0.1.0 event shape (docs/14-substreams.md §2).
    This deployment's params target AvalRegistry on World Chain MAINNET
    (chainId 480, 0x6fEfEf2d44203300a6a33d631840C972181b8722); the same .spkg
    indexes Circles on Gnosis or any platform's registry on any EVM chain with
    different params only.

imports:
  # Provides sf.substreams.sink.database.v1.DatabaseChanges — map_edge_deltas/db_out's output
  # type. Without this, `substreams pack` fails: "proto message type
  # ...DatabaseChanges not found in package proto definitions" (found by actually running
  # `substreams pack`, not by inspection).
  database: https://github.com/streamingfast/substreams-sink-database-changes/releases/download/v4.0.0/substreams-sink-database-changes-v4.0.0.spkg
  #
  # DELIBERATELY NOT IMPORTED — substreams-sink-sql protodefs-v1.0.7
  # (`sql: https://github.com/streamingfast/substreams-sink-sql/releases/download/protodefs-v1.0.7/substreams-sink-sql-protodefs-v1.0.7.spkg`)
  # Importing it declares `sf.substreams.sink.sql.v1.Service` a SECOND time: the substreams CLI
  # (verified on v1.20.2) already bundles that symbol itself, in
  # `sf/substreams/sink/sql/v1/deprecated.proto`, into every packed spkg. `substreams pack` and
  # `substreams info` tolerate the duplicate, but `substreams run` builds a full proto registry
  # for its output decoder and dies before it ever opens a connection:
  #   Error: creating ui: new decoder: new any resolver: get proto files registry:
  #   proto: file "sf/substreams/sink/sql/v1/deprecated.proto" has a name conflict over
  #   sf.substreams.sink.sql.v1.Service
  # — i.e. with that import present, this package could not be streamed at all, on ANY chain,
  # including the exact Base command PROOF.md §7.2 records. Removing it fixes `substreams run`
  # and costs nothing: `substreams info` still resolves `sink.type` below and still loads
  # schema.sql, because the CLI's own bundled descriptor supplies the type. Found by running the
  # command, not by inspection.

protobuf:
  files:
    - trust_graph.proto
  importPaths:
    - ./proto
  excludePaths:
    - sf/substreams
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/aval_trust_graph.wasm

# NETWORK NOTE (read before running):
# `worldchain` is World Chain MAINNET (chainId 480) and it IS in
# StreamingFast's network registry:
#   $ substreams tools default-endpoint worldchain
#   mainnet.worldchain.streamingfast.io:443
# Aval's contracts moved from World Chain Sepolia (4801) to mainnet on
# 2026-07-25, so this manifest now points at the real chain, the real
# contract, and the block the real contract was created in — no substitution,
# no fallback chain. World Chain SEPOLIA still has no Firehose/Substreams
# endpoint from any provider (`substreams tools default-endpoint
# worldchain-sepolia` -> "no endpoint found for network worldchain-sepolia"),
# which is exactly why the move to mainnet is what unblocked live streaming.
# See ../PROOF.md §9 for the live run and the independent eth_getLogs
# cross-check of the decoded output.
network: worldchain

params:
  # DEFAULT PROFILE — Aval on World Chain mainnet. Mirrored by `networks.worldchain.params`
  # below; this top-level block is what a bare `substreams run`/`pack` with no `--network`
  # uses.
  #
  # AvalRegistry on World Chain mainnet — deployments/worldchain-mainnet.json's
  # `contracts.AvalRegistry` is STALE (it names 0x7a294C7C…, an abandoned first
  # attempt); the live registry the app writes to, and the one that carries the
  # real Enrolled/Vouched logs, is 0x6fEfEf2d…  (see ../PROOF.md §9.1).
  map_trust_events: "contract=0x6fefef2d44203300a6a33d631840c972181b8722&vouch_topic=0x1023f6bd7654e275f0ff5868480691e3f5feb9960e997af34f0cf9e4b33e22b9&revoke_topic=0xb1c57350b08a198ff1a7862eeb3246e35fa3fc8e954bc691997ce37da018cbc7&reaffirm_topic=0x9089bae040c16337c6e96ac1661dba8c85c8b076f44d68407b4fa00243c05db7&report_topic=&report_resolved_topic=&from_topic=1&to_topic=2&scope_topic=&vouch_tail=issued_expires&revoke_tail=at&reaffirm_tail=expires&model=WEIGHTED&protocol=aval&network=worldchain"

# ─── ADAPTER PROFILES — one .spkg, five chains, two protocols ────────────────────────────────
#
# This is trust-graph v0.2.0's composability claim made operational, and it is the ONLY thing
# that differs between chains: no Rust is recompiled, no module graph changes, no second package
# is built. `substreams run ./substreams.yaml db_out --network base -e base` swaps the profile.
#
# Each entry is an ADAPTER PROFILE in the sense of docs/17-trust-graph-standard.md §6: a
# declaration of how one contract's event vocabulary maps onto the standard's TrustEdge. Adding a
# sixth protocol means adding an entry here — see §7 of that doc for the checklist.
#
# READ THE initialBlock VALUES HONESTLY. For `worldchain` it is AvalRegistry's real creation
# block, so that profile indexes the protocol's ENTIRE history (~3.5k blocks — Aval is days old).
# For the four EAS profiles it is a DEMO WINDOW START, not EAS's deployment block: `store_edges`
# is a Substreams store and must process every block from `initialBlock` forward, and EAS has
# been live on Ethereum since 2023 — a full backfill is a scale exercise, not a correctness one,
# and would take hours. Each window was chosen because it provably contains real Attested AND/OR
# Revoked logs (verified independently via Blockscout before streaming — ../PROOF.md §9.3), not
# because it is the beginning of anything. `trust_edges` therefore holds EAS edges from these
# blocks onward, not all of EAS history. Stated here rather than left for a reader to infer.
networks:
  # ── Aval — World Chain mainnet (chainId 480). The reference implementation of the standard.
  worldchain:
    initialBlock:
      map_trust_events: 32833177 # AvalRegistry creation block — full protocol history
      store_edges: 32833177
      map_edge_deltas: 32833177
      db_out: 32833177
    params:
      map_trust_events: "contract=0x6fefef2d44203300a6a33d631840c972181b8722&vouch_topic=0x1023f6bd7654e275f0ff5868480691e3f5feb9960e997af34f0cf9e4b33e22b9&revoke_topic=0xb1c57350b08a198ff1a7862eeb3246e35fa3fc8e954bc691997ce37da018cbc7&reaffirm_topic=0x9089bae040c16337c6e96ac1661dba8c85c8b076f44d68407b4fa00243c05db7&report_topic=&report_resolved_topic=&from_topic=1&to_topic=2&scope_topic=&vouch_tail=issued_expires&revoke_tail=at&reaffirm_tail=expires&model=WEIGHTED&protocol=aval&network=worldchain"

  # ── EAS — Ethereum Attestation Service. Same .spkg, four chains, one profile shape.
  #
  # `Attested(address indexed recipient, address indexed attester, bytes32 uid, bytes32 indexed schemaUID)`
  # `Revoked (address indexed recipient, address indexed attester, bytes32 uid, bytes32 indexed schemaUID)`
  #
  # Three things every EAS profile must say, and why:
  #   from_topic=2 / to_topic=1  EAS declares the SUBJECT first and the ASSERTER second — the
  #                              opposite of Aval. Without this the edge points backwards.
  #   scope_topic=3              schemaUID. One attester holds many live attestations about the
  #                              same recipient under different schemas; revoking one must not
  #                              revoke the rest.
  #   *_tail=none                the only non-indexed word is the attestation `uid`, a content
  #                              hash. There is no timing data in an EAS log at all. Declaring
  #                              `none` yields issued_at = block clock and expires_at = 0
  #                              (the standard's perpetual sentinel) instead of a hash decoded
  #                              as a year-2106 expiry (the v0.1.0 behaviour, PROOF.md §8.2).
  #                              EAS's real `expirationTime` is contract storage, not log data.
  base:
    initialBlock:
      map_trust_events: 49110120
      store_edges: 49110120
      map_edge_deltas: 49110120
      db_out: 49110120
    params:
      map_trust_events: "contract=0x4200000000000000000000000000000000000021&vouch_topic=0x8bf46bf4cfd674fa735a3d63ec1c9ad4153f033c290341f3a588b75685141b35&revoke_topic=0xf930a6e2523c9cc298691873087a740550b8fc85a0680830414c148ed927f615&reaffirm_topic=&report_topic=&report_resolved_topic=&from_topic=2&to_topic=1&scope_topic=3&vouch_tail=none&revoke_tail=none&model=ISSUANCE&protocol=eas&network=base"

  optimism:
    initialBlock:
      map_trust_events: 154673910
      store_edges: 154673910
      map_edge_deltas: 154673910
      db_out: 154673910
    params:
      map_trust_events: "contract=0x4200000000000000000000000000000000000021&vouch_topic=0x8bf46bf4cfd674fa735a3d63ec1c9ad4153f033c290341f3a588b75685141b35&revoke_topic=0xf930a6e2523c9cc298691873087a740550b8fc85a0680830414c148ed927f615&reaffirm_topic=&report_topic=&report_resolved_topic=&from_topic=2&to_topic=1&scope_topic=3&vouch_tail=none&revoke_tail=none&model=ISSUANCE&protocol=eas&network=optimism"

  # EAS on Arbitrum One is NOT a predeploy — different address from the OP-stack chains above.
  # Same profile shape regardless, which is the point.
  arbitrum:
    initialBlock:
      map_trust_events: 487448500
      store_edges: 487448500
      map_edge_deltas: 487448500
      db_out: 487448500
    params:
      map_trust_events: "contract=0xbd75f629a22dc1ced33dda0b68c546a1c035c458&vouch_topic=0x8bf46bf4cfd674fa735a3d63ec1c9ad4153f033c290341f3a588b75685141b35&revoke_topic=0xf930a6e2523c9cc298691873087a740550b8fc85a0680830414c148ed927f615&reaffirm_topic=&report_topic=&report_resolved_topic=&from_topic=2&to_topic=1&scope_topic=3&vouch_tail=none&revoke_tail=none&model=ISSUANCE&protocol=eas&network=arbitrum"

  mainnet:
    initialBlock:
      map_trust_events: 25601310
      store_edges: 25601310
      map_edge_deltas: 25601310
      db_out: 25601310
    params:
      map_trust_events: "contract=0xa1207f3bba224e2c9c3c6d5af63d0eb1582ce587&vouch_topic=0x8bf46bf4cfd674fa735a3d63ec1c9ad4153f033c290341f3a588b75685141b35&revoke_topic=0xf930a6e2523c9cc298691873087a740550b8fc85a0680830414c148ed927f615&reaffirm_topic=&report_topic=&report_resolved_topic=&from_topic=2&to_topic=1&scope_topic=3&vouch_tail=none&revoke_tail=none&model=ISSUANCE&protocol=eas&network=mainnet"

modules:
  - name: map_trust_events # raw block -> TrustEvents
    kind: map
    # AvalRegistry's creation block on World Chain mainnet, pinned by eth_getCode
    # (0 bytes at 32833176, 7645 bytes at 32833177) and by the creation receipt for
    # 0x8636e08a48a01c5b6a4c200fb7a7039fc11764870ef5830925e762337d712384, which reports
    # blockNumber 32833177. NOT 32833180 (that block is 3 later and already has code).
    initialBlock: 32833177
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:aval.trust.v1.TrustEvents

  - name: store_edges # accumulate live edge state
    kind: store
    updatePolicy: set
    valueType: proto:aval.trust.v1.Edge
    inputs:
      - map: map_trust_events

  - name: map_edge_deltas # store deltas -> database changes (CDC)
    kind: map
    initialBlock: 32833177
    inputs:
      - store: store_edges
        mode: deltas
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

  - name: db_out
    # Stable-name passthrough (docs/14 §2 lists db_out as its own module with
    # the same DatabaseChanges output as map_edge_deltas). Kept as a distinct
    # module — not inlined into map_edge_deltas — so `sink.module: db_out`
    # below is a fixed target unaffected by how the CDC transform evolves
    # upstream.
    kind: map
    initialBlock: 32833177
    inputs:
      - map: map_edge_deltas
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

sink:
  module: db_out
  type: sf.substreams.sink.sql.v1.Service
  config:
    schema: ./schema.sql
    engine: clickhouse
